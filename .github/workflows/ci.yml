name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the project runtime. Nuxt 4.5 requires ^22.19 || ^24.11 || >=26;
  # 24 is the active LTS line. See docs/architecture/versions-and-runtime.md.
  NODE_VERSION: '24'

# Every external action is pinned to a full commit SHA, with the release in a
# trailing comment. A tag is a moving pointer: whoever can move `v5` can run
# their code in this workflow. The comment is for humans; the SHA is the
# contract. Re-resolve both when bumping, never edit the comment alone.
jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: No credential or server-only value in the client bundle
        run: |
          set -euo pipefail
          # ADR-0005's central claim, checked mechanically against the built
          # artefact rather than trusted: the browser bundle must contain no
          # bearer token, no upstream origin, and none of the BFF's private
          # runtime config. A leak here is not a style problem — it is the
          # design being inverted.
          leaked=0
          for needle in prrn_ Authorization apiBase apiTimeoutMs trustedOrigins api.purrenade; do
            if grep -rlF "$needle" .output/public/ >/dev/null 2>&1; then
              echo "ERROR: '$needle' appears in the client bundle:"
              grep -rlF "$needle" .output/public/ | head -5
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] || exit 1
          echo "no credential or server-only value in the client bundle"

      - name: No auth state written to web storage
        run: |
          set -euo pipefail
          # Nuxt's own reload guard writes one `nuxt:reload` key, which is a
          # path and a timestamp. Anything else writing to web storage is a
          # candidate for auth state an XSS defect could read.
          offenders=$(grep -rhoE "(localStorage|sessionStorage)\.setItem\(\`?[a-zA-Z:_-]*" .output/public/ 2>/dev/null \
            | grep -v 'nuxt:reload' || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: unexpected web-storage writes in the client bundle:"
            echo "$offenders" | sort -u
            exit 1
          fi
          echo "no unexpected web-storage writes"

      - name: Fonts are self-hosted
        run: |
          set -euo pipefail
          # design-tokens.md §2.1 and licensing-and-rights.md §5: loading fonts
          # from a third party transmits every visitor's IP address to it, which
          # is a KVKK/GDPR problem before it is a performance one.
          if grep -rlE "fonts\.(googleapis|gstatic)\.com" .output/public/ >/dev/null 2>&1; then
            echo "ERROR: a third-party font origin is referenced in the build"
            grep -rlE "fonts\.(googleapis|gstatic)\.com" .output/public/ | head
            exit 1
          fi
          test "$(find .output/public -name '*.woff2' | wc -l)" -gt 0 \
            || { echo "ERROR: no self-hosted font files were emitted"; exit 1; }
          echo "fonts are self-hosted ($(find .output/public -name '*.woff2' | wc -l) files)"

      - name: Phaser must not enter a non-run bundle
        run: |
          set -euo pipefail
          # The engine is lazily loaded on the run route only.
          #
          # This gate used to grep the whole of _nuxt/ for the string `phaser`
          # and fail on any hit. That passed for as long as Phaser was unused,
          # and would have failed the moment it was used *correctly* — a lazy
          # chunk is still a file in that directory. The next person to hit it
          # would have "fixed" the gate rather than the bundle.
          #
          # What the name actually claims is asserted instead, in three parts:
          #
          #   1. Phaser's code is in exactly ONE chunk.
          #   2. NOTHING statically imports that chunk — a static import would
          #      pull 1.4 MB into whatever imports it, transitively into the
          #      entry.
          #   3. SOMETHING dynamically imports it. Without this the gate would
          #      also pass if the engine were deleted, or if the run route quietly
          #      stopped loading it.
          python3 - <<'EOF'
          import pathlib, re, sys

          chunks = sorted(pathlib.Path('.output/public/_nuxt').glob('*.js'))

          # `phaser.io` appears in Phaser's own runtime strings and nowhere else.
          # Matching on the bare word `phaser` would also match any chunk that
          # merely *references* a chunk whose filename contained it, which is a
          # false positive waiting for a differently-hashed build.
          MARKER = 'phaser.io'

          carriers = [c for c in chunks if MARKER in c.read_text(errors='ignore')]

          if len(carriers) != 1:
              print(f'ERROR: expected Phaser in exactly one chunk, found {len(carriers)}.')
              for c in carriers:
                  print('  ', c.name, f'({c.stat().st_size // 1024} KB)')
              if not carriers:
                  print(f'No chunk contains {MARKER!r}. Either Phaser is no longer bundled,')
                  print('or its runtime strings changed and this marker needs updating.')
              sys.exit(1)

          carrier = carriers[0].name
          static_refs, dynamic_refs = [], []

          for chunk in chunks:
              if chunk.name == carrier:
                  continue

              text = chunk.read_text(errors='ignore')

              if carrier not in text:
                  continue

              # Quotes or backticks: the bundler picks, and it has picked
              # backticks before.
              if re.search(r'import\s*\(\s*[`\'"][^`\'"]*' + re.escape(carrier), text):
                  dynamic_refs.append(chunk.name)

              # Three static shapes, not one. The original required the literal
              # `from`, so a bare side-effect import and a re-export both pulled
              # the chunk in statically and matched neither branch.
              static_patterns = (
                  r'(?:^|[;\s}])import\b[^(]{0,200}?from\s*[`\'"][^`\'"]*' + re.escape(carrier),
                  r'(?:^|[;\s}])import\s*[`\'"][^`\'"]*' + re.escape(carrier),
                  r'(?:^|[;\s}])export\b[^(]{0,200}?from\s*[`\'"][^`\'"]*' + re.escape(carrier),
              )

              if any(re.search(p, text) for p in static_patterns):
                  static_refs.append(chunk.name)

          if static_refs:
              print(f'ERROR: {carrier} (Phaser) is statically imported by: {static_refs}')
              print('It must be reached only through a dynamic import() inside game/engine.')
              sys.exit(1)

          if not dynamic_refs:
              print(f'ERROR: nothing dynamically imports {carrier} (Phaser).')
              print('Either the engine is no longer loaded, or the lazy boundary has moved.')
              sys.exit(1)

          # 4. The importer must be the run route's chunk, not just *a* chunk.
          #
          # Without this the gate passes while the landing page pulls Phaser:
          # `onMounted(() => { void import('phaser') })` in index.vue leaves one
          # carrier, no static importer, and a dynamic importer — all three
          # green, 1.3 MB on the entry path. "Exactly one lazily-loaded chunk"
          # was never the property worth asserting; *who* loads it is.
          #
          # The run route is identified by a string only its page emits.
          RUN_MARKER = 'run__surface'

          run_chunks = {c.name for c in chunks if RUN_MARKER in c.read_text(errors='ignore')}

          if not run_chunks:
              print(f'ERROR: no chunk contains {RUN_MARKER!r}, so the run route cannot be identified.')
              print('If the run page stopped emitting that class, update the marker here.')
              sys.exit(1)

          # An importer is legitimate if it is the run chunk, or is reached only
          # from it — in practice Vite emits the engine import inside the run
          # page chunk itself or a chunk the run chunk names.
          stray = [
              name for name in dynamic_refs
              if name not in run_chunks
              and not any(name in (pathlib.Path('.output/public/_nuxt') / rc).read_text(errors='ignore') for rc in run_chunks)
          ]

          if stray:
              print(f'ERROR: {carrier} (Phaser) is dynamically imported from outside the run route: {stray}')
              print(f'Run-route chunks: {sorted(run_chunks)}')
              print('Phaser must be reached only from the run route.')
              sys.exit(1)

          EOF

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve the built app
        # No backend, and that is the point.
        #
        # The two repositories are independent and must stay that way, so this
        # job does not stand up the API, does not check it out, and holds no
        # credentials. What it enforces is everything provable without a
        # session — which turns out to be most of the browser-level claims this
        # milestone makes: that Phaser is absent from the entry bundle at three
        # viewports, that the run route redirects a signed-out visitor, that no
        # engine chunk is fetched before that redirect happens, and the whole
        # responsive and accessibility pass over the auth surface.
        #
        # The session store never holds a session here, so the boot guard's
        # acknowledgement flag is honest rather than a weakening.
        run: |
          PURRENADE_ALLOW_FS_SESSIONS=1 PORT=4399 NITRO_PORT=4399 \
            node .output/server/index.mjs &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4399/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4399/

      - name: No credential reaches server-rendered HTML
        # SSR resolves the BFF session now, so ADR-0005's promise — the API
        # credential never reaches the browser — has a new way to be broken:
        # by serialisation into the page rather than by a header.
        #
        # Provable here with no backend at all, because `readSession` only
        # consults the local store. Planting a record with a canary token
        # exercises the whole SSR resolution path, and the upstream call then
        # fails (there is no API in this job) — which is the *other* thing this
        # asserts: a BFF the render cannot reach must still return a 200 with an
        # unresolved status, never a 500 and never a confident "guest".
        run: |
          set -euo pipefail

          now=$(node -e 'process.stdout.write(String(Date.now()))')
          sid=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')

          install -d -m 700 .data/sessions
          cat > ".data/sessions/$sid" <<EOF
          {"apiToken":"9999|prrn_CANARY_MUST_NOT_LEAK","userId":9999,
           "csrfToken":"CANARY_CSRF_MUST_NOT_LEAK","createdAt":$now,"lastSeenAt":$now}
          EOF
          chmod 600 ".data/sessions/$sid"

          code=$(curl -s -o /tmp/ssr.html -w '%{http_code}' \
            -H "Cookie: __Host-purrenade_session=$sid" http://127.0.0.1:4399/)

          rm -f ".data/sessions/$sid"

          if [ "$code" != "200" ]; then
            echo "::error::SSR with an unreachable BFF returned $code, not 200"
            exit 1
          fi

          leaked=0
          for needle in CANARY prrn_ apiToken csrfToken pendingTwoFactor challengeToken \
                        'Bearer ' otpauth:// api.purrenade "$sid"; do
            if grep -qF -- "$needle" /tmp/ssr.html; then
              echo "::error::'$needle' appears in server-rendered HTML"
              leaked=1
            fi
          done

          [ "$leaked" -eq 0 ] || exit 1
          echo "no credential in server-rendered HTML, and the degraded path still renders"

      - name: An anonymous page is server-rendered resolved, not unresolved
        # The other half of the same defect. Before SSR resolved the session,
        # `/` server-rendered its "we do not know yet" branch to *everybody* and
        # swapped it on the client — a hydration mismatch on every single load,
        # signed in or not.
        run: |
          set -euo pipefail

          curl -sf http://127.0.0.1:4399/ > /tmp/anon.html

          if grep -q 'home__resolving' /tmp/anon.html; then
            echo "::error::anonymous / server-renders the unresolved branch"
            exit 1
          fi

          echo "anonymous / server-renders a resolved guest"

      - name: Browser acceptance, no account required
        # `@stack` marks the handful of cases that genuinely need the API. They
        # run in the full-stack pass, not here — and they are reported as not
        # run, never as passed.
        run: npx playwright test --project=chrome --grep-invert @stack
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4399

      - name: Account for every browser case this job cannot run
        # The gap is real and it is not closing here: the cases below drive the
        # signed-in `/run` route, and standing up the API would mean coupling
        # two deliberately independent repositories inside CI.
        #
        # What this step refuses to allow is the gap *widening in silence*. Any
        # new browser spec must either run in this job or be listed here with a
        # reason. A spec that quietly stops being executed used to look exactly
        # like a spec that passes.
        run: |
          set -euo pipefail

          # Specs that need a session, and why. Keep sorted.
          cat > /tmp/expected-unrun <<'EOF'
          run-lifecycle.spec.ts
          run-obstacles.spec.ts
          run-scoring.spec.ts
          run-surface.spec.ts
          run-touch.spec.ts
          ssr-auth-session.spec.ts
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-unrun

          # Everything the executed project actually ran.
          npx playwright test --project=chrome --grep-invert @stack --list --reporter=list \
            > /tmp/ran.txt 2>&1 || true

          ACTUAL_UNRUN=$(mktemp)
          for spec in tests/e2e/*.spec.ts; do
            name=$(basename "$spec")
            grep -q "$name" /tmp/ran.txt || echo "$name" >> "$ACTUAL_UNRUN"
          done
          sort -o "$ACTUAL_UNRUN" "$ACTUAL_UNRUN" 2>/dev/null || true
          sort -o /tmp/expected-unrun /tmp/expected-unrun

          echo "Browser specs this job does not execute:"
          cat "$ACTUAL_UNRUN" || true

          if ! diff -u /tmp/expected-unrun "$ACTUAL_UNRUN"; then
            echo "::error::The set of browser specs CI cannot run has changed."
            echo "Either make the new spec runnable without a session, or record"
            echo "it above with the reason it needs one. Never leave it silent."
            exit 1
          fi
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4399

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Verify documentation structure
        run: |
          set -euo pipefail
          for d in docs/product docs/architecture docs/game docs/testing docs/decisions; do
            test -d "$d" || { echo "missing required directory: $d"; exit 1; }
          done
          test -f docs/README.md
          test -f docs/product/game-specification.md
          test -f docs/product/open-decisions.md
          echo "documentation structure OK"

      - name: Verify no private source material is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^design-reference/private-source/'; then
            echo "ERROR: private source material is tracked by git"
            exit 1
          fi
          echo "no private source material tracked"

      - name: Verify no dependency or build output is tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '^(node_modules|\.nuxt|\.output|dist)/'; then
            echo "ERROR: dependency or build output is tracked by git"
            exit 1
          fi
          echo "no dependency or build output tracked"

      - name: Locale files must have identical keys
        run: |
          set -euo pipefail
          # A missing key renders as the key itself, which ships as a visible
          # defect in one language only — the kind nobody notices until a player
          # reports it. tr is the source locale (ADR-0007).
          python3 - <<'EOF'
          import json, sys

          def keys(obj, prefix=''):
              out = set()
              for key, value in obj.items():
                  path = f'{prefix}.{key}' if prefix else key
                  out |= keys(value, path) if isinstance(value, dict) else {path}
              return out

          source = keys(json.load(open('i18n/locales/tr.json', encoding='utf-8')))
          failed = False

          for locale in ('en', 'es'):
              other = keys(json.load(open(f'i18n/locales/{locale}.json', encoding='utf-8')))
              missing, extra = sorted(source - other), sorted(other - source)
              if missing or extra:
                  failed = True
                  print(f'ERROR: {locale}.json differs from tr.json')
                  for key in missing: print(f'   missing: {key}')
                  for key in extra:   print(f'   extra:   {key}')

          if failed:
              sys.exit(1)

          print(f'all locales carry the same {len(source)} keys')
          EOF

      - name: No bearer token is stored in web storage anywhere in source
        run: |
          set -euo pipefail
          # ADR-0005: no browser code may store a bearer token. Checked against
          # source as well as the bundle, so the intent is visible in review.
          if grep -rnE "(localStorage|sessionStorage)\.setItem" app/ game/ 2>/dev/null; then
            echo "ERROR: browser code writes to web storage; ADR-0005 forbids storing credentials there."
            exit 1
          fi
          echo "no web-storage writes in app/ or game/"

      - name: No persisted Loli queue
        run: |
          set -euo pipefail
          # G16. `scoring-and-progression.md` 2.4 is explicit: the Loli queue is
          # run-scoped and dies with the run. `owedLoliBonuses` was the name the
          # rejected persistent design used, so the name itself is the tripwire.
          #
          # It is checked as an *identifier*, not as a string: comments and
          # documentation have to be able to name the rejected design in order
          # to reject it, and several deliberately do. So source files are
          # stripped of their comments first and the survivors are what fails
          # the build. The run-scoped field is `queuedLoliBonuses`; the leading
          # word boundary keeps the check off it.
          python3 - <<'EOF'
          import re, sys, pathlib

          ROOTS = ['app', 'game', 'server', 'i18n', 'tests', 'shared']
          SUFFIX = {'.ts', '.tsx', '.vue', '.js', '.mjs', '.json'}
          NAME = re.compile(r'\bowed[-_]?loli[-_]?bonus', re.I)

          def strip_comments(text: str) -> str:
              """Blank out // and /* */ comments, respecting string and template literals."""
              out, i, n = [], 0, len(text)
              while i < n:
                  c = text[i]
                  if c in '\'"`':
                      quote, i = c, i + 1
                      out.append(quote)
                      while i < n and text[i] != quote:
                          if text[i] == '\\':
                              out.append(text[i:i + 2]); i += 2; continue
                          out.append(text[i]); i += 1
                      if i < n:
                          out.append(quote); i += 1
                      continue
                  if text.startswith('//', i):
                      while i < n and text[i] != '\n':
                          i += 1
                      continue
                  if text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      i = n if end == -1 else end + 2
                      continue
                  if text.startswith('<!--', i):
                      end = text.find('-->', i + 4)
                      i = n if end == -1 else end + 3
                      continue
                  out.append(c); i += 1
              return ''.join(out)

          hits = []
          for root in ROOTS:
              for path in sorted(pathlib.Path(root).rglob('*')) if pathlib.Path(root).is_dir() else []:
                  if path.suffix not in SUFFIX or not path.is_file():
                      continue
                  for lineno, line in enumerate(strip_comments(path.read_text(encoding='utf-8')).splitlines(), 1):
                      if NAME.search(line):
                          hits.append(f'{path.as_posix()}:{lineno}: {line.strip()}')

          if hits:
              print("ERROR: 'owedLoliBonuses' names the rejected persistent Loli queue.")
              print('The queue is run-scoped: see docs/product/scoring-and-progression.md 2.4.')
              for hit in hits:
                  print('  ', hit)
              sys.exit(1)

          print('no persisted Loli queue in source')
          EOF

      - name: Each RNG stream has exactly one consumer
        run: |
          set -euo pipefail
          # G23. Determinism rests on the three streams staying independent, and
          # the only way that breaks is a second module quietly drawing from
          # someone else's stream. Ownership is asserted by file, not by count: a
          # test can prove a decorative draw does not move obstacles today, but
          # only this check stops a new module from being added tomorrow.
          python3 - <<'EOF'
          import re, sys, pathlib

          OWNER = {
              'pattern': {'game/domain/obstacles.ts'},
              'collectible': {'game/domain/collectibles.ts'},
              'cosmetic': set(),   # reserved: nothing may draw from it yet
          }
          # `state.ts` freezes all three by name in `sealState`; that is not a draw.
          EXEMPT = {'game/domain/state.ts'}

          failed = False
          for path in sorted(pathlib.Path('game').rglob('*.ts')):
              rel = path.as_posix()
              if rel.endswith('.spec.ts') or rel in EXEMPT:
                  continue
              text = path.read_text(encoding='utf-8')
              for stream in re.findall(r'rng\.(pattern|collectible|cosmetic)\b', text):
                  if rel not in OWNER[stream]:
                      owner = ', '.join(sorted(OWNER[stream])) or '(reserved, no consumer)'
                      print(f'ERROR: {rel} draws from the "{stream}" stream; owner is {owner}')
                      failed = True

          if failed:
              print('Streams are independent only while each has one consumer.')
              print('See docs/game/determinism-and-rng.md.')
              sys.exit(1)

          print('each RNG stream has exactly one consumer')
          EOF

      - name: Check the decision register is complete
        run: |
          set -euo pipefail
          # Every question defined in an owning document's "Open questions" table
          # must also appear in the register, so the register stays the live list.
          python3 - <<'EOF'
          import os, re, sys
          P = (r'(?:CR|DO|SP|TU|SI|AU|LB|LO|AC|AA|PWA|GE|RNG|ARCH|SEC|LR|OPS'
               r'|ASSET|API|BA|CH|PR|AD|GR|RL|QJ|OB|DM|AUTH|CACHE|ANTI|2FA)-\d+')
          defined = set()
          for dp, _, fn in os.walk('docs'):
              for f in fn:
                  if not f.endswith('.md'):
                      continue
                  text = open(os.path.join(dp, f), encoding='utf-8').read()
                  # A resolved question keeps its id, struck through. Those rows are
                  # still definitions, and skipping them let a whole class of row
                  # escape the check.
                  defined |= set(re.findall(
                      r'^\|\s*(?:~~)?\*{0,2}(' + P + r')\*{0,2}(?:~~)?\s*\|', text, re.M))
          register = set(re.findall(
              r'\b(' + P + r')\b',
              open('docs/product/open-decisions.md', encoding='utf-8').read()))
          missing = sorted(defined - register)
          if missing:
              print('ERROR: open questions missing from docs/product/open-decisions.md:')
              for ref in missing:
                  print('  ', ref)
              sys.exit(1)
          print(f'decision register complete: {len(defined)} questions tracked')
          EOF
